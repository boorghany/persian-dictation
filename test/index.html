<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تست گفتار فارسی</title>
<style>
  :root { --bg:#fafafa; --fg:#111; --muted:#999; --card:#fff; --border:#ddd; --accent:#1a73e8; --rec:#d93025; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --fg:#eee; --muted:#777; --card:#202020; --border:#333; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.9 system-ui, "Vazirmatn", Tahoma, sans-serif; }
  main { max-width:820px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; margin:0 0 16px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  button, select { font:inherit; padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--fg); cursor:pointer; }
  #toggle { background:var(--accent); color:#fff; border:none; min-width:120px; }
  #toggle.on { background:var(--rec); }
  #status { color:var(--muted); font-size:14px; }
  #out { min-height:240px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; font-size:20px; white-space:pre-wrap; }
  .interim { color:var(--muted); }
  #log { margin-top:16px; font-size:13px; color:var(--muted); direction:ltr; text-align:left; white-space:pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>تست Web Speech کروم — فارسی</h1>
  <div class="bar">
    <button id="toggle">شروع</button>
    <select id="lang">
      <option value="fa-IR" selected>fa-IR</option>
      <option value="fa">fa</option>
      <option value="en-US">en-US</option>
    </select>
    <button id="copy">کپی متن</button>
    <button id="clear">پاک کردن</button>
    <span id="status">آماده</span>
  </div>
  <div id="out"><span id="final"></span><span id="interim" class="interim"></span></div>
  <div id="log"></div>
</main>
<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const $ = id => document.getElementById(id);
const log = m => { $('log').textContent = new Date().toLocaleTimeString() + '  ' + m + '\n' + $('log').textContent; };
if (!SR) { $('status').textContent = 'این مرورگر Web Speech ندارد — Google Chrome لازم است'; $('toggle').disabled = true; }

let rec = null, running = false, lastAudioEnd = 0;

function start() {
  rec = new SR();
  rec.lang = $('lang').value;
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  rec.onstart = () => { $('status').textContent = 'در حال گوش دادن…'; log('start lang=' + rec.lang); };
  rec.onspeechend = () => { lastAudioEnd = performance.now(); };
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i], t = r[0].transcript;
      if (r.isFinal) {
        $('final').textContent += t.trim() + ' ';
        log('final  conf=' + (r[0].confidence || 0).toFixed(2) + '  "' + t.trim() + '"');
      } else interim += t;
    }
    $('interim').textContent = interim;
  };
  rec.onerror = e => { log('error: ' + e.error + (e.message ? ' — ' + e.message : '')); $('status').textContent = 'خطا: ' + e.error; };
  // Chrome ends sessions after silence or ~60s; restart while the user hasn't stopped.
  rec.onend = () => { log('end'); if (running) rec.start(); else $('status').textContent = 'متوقف'; };
  rec.start();
}

$('toggle').onclick = () => {
  running = !running;
  $('toggle').textContent = running ? 'توقف' : 'شروع';
  $('toggle').classList.toggle('on', running);
  if (running) start(); else rec && rec.stop();
};
$('copy').onclick = () => navigator.clipboard.writeText($('final').textContent.trim());
$('clear').onclick = () => { $('final').textContent = ''; $('interim').textContent = ''; };
</script>
</body>
</html>
